name: Accessibility Check

on:
  push:
    branches: [main]
    paths:
      - 'blogs/accessibility/A11y-Test-Playground/**'
  pull_request:
    branches: [main]
    paths:
      - 'blogs/accessibility/A11y-Test-Playground/**'

jobs:
  pa11y-success-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blogs/accessibility/A11y-Test-Playground/a11y-ci
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run Pa11y against a clean page (expected to pass)
        run: npx pa11y-ci --config pa11y-ci.success.json --json > pa11y-success-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pa11y-success-results
          path: blogs/accessibility/A11y-Test-Playground/a11y-ci/pa11y-success-results.json

  pa11y-fail-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blogs/accessibility/A11y-Test-Playground/a11y-ci
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run Pa11y against pages with deliberate violations (expected to fail)
        run: npx pa11y-ci --config pa11y-ci.fail.json --json > pa11y-fail-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pa11y-fail-results
          path: blogs/accessibility/A11y-Test-Playground/a11y-ci/pa11y-fail-results.json
