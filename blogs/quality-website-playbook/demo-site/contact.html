<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:#FDF6EC;color:#3E2723;line-height:1.6;}
  a{color:inherit;}
  a:focus{outline:none;}
  header{background:#3E2723;padding:1rem 1.5rem;}
  .nav-inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
  .logo{color:#FDF6EC;font-family:'Fraunces',serif;font-weight:700;font-size:1.3rem;text-decoration:none;}
  nav a{color:#E8D9C5;text-decoration:none;margin-left:1.5rem;font-size:.95rem;}
  nav a:hover{color:#fff;}
  main{max-width:560px;margin:0 auto;padding:3rem 1.5rem;}
  h1{font-family:'Fraunces',serif;font-size:2.2rem;margin-bottom:1.2rem;}
  p{margin-bottom:1.4rem;color:#5C4433;}
  /* FORMS: inputs styled with placeholder text standing in for labels, no <label> elements in the markup below */
  input, textarea{width:100%;padding:.75rem .9rem;margin-bottom:1rem;border:1px solid #E8D9C5;border-radius:8px;font-family:inherit;font-size:.95rem;background:#fff;color:#3E2723;}
  textarea{min-height:120px;resize:vertical;}
  button{background:#6F4E37;color:#fff;padding:.8rem 1.6rem;border:none;border-radius:8px;font-weight:600;font-size:.95rem;cursor:pointer;}
  button:hover{background:#5a3e2b;}
  footer{background:#3E2723;color:#C9B8A0;padding:2rem 1.5rem;text-align:center;font-size:.85rem;margin-top:2rem;}
  footer a{color:#E8D9C5;}
</style>

  window.dataLayer = window.dataLayer || [];

  gtag('js', new Date());
  gtag('config', 'G-XXXXXXX');
</script>
</head>
<body>

<header>
  <div class="nav-inner">
    <a class="logo" href="index.html">Grove &amp; Bean</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="blog.html">Journal</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main>
  <h1>Get in touch</h1>
  <p>Questions about an order, wholesale, or anything else, send us a note and we'll get back to you.</p>

  <!-- FORMS-1: no <label> elements (placeholder text only), email field has no type="email" or required.
       FORMS-2: no client-side validation on any field.
       FORMS-3: action points nowhere, no success or error state on submit. -->
  <form action="#" method="post">
    <input type="text" name="name" placeholder="Your name">
    <input type="text" name="email" placeholder="Your email">
    <textarea name="message" placeholder="Your message"></textarea>
    <button type="submit">Send message</button>
  </form>
</main>

<footer>
